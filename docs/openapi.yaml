openapi: 3.1.0
info:
  title: Chatbot API
  version: 1.0.0
  description: Simple chatbot backend API with Express
servers:
  - url: http://localhost:3000
    description: Development server
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the server status and current timestamp
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /about:
    get:
      summary: Get professional information
      description: Returns professional summary information from CV
      responses:
        '200':
          description: Professional information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /experience:
    get:
      summary: Get work experience
      description: Returns work experience information from CV
      responses:
        '200':
          description: Work experience retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceResponse'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chat:
    post:
      summary: Send a message to the chatbot
      description: Sends a user message and receives a bot response with conversation history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response from chatbot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Missing message in request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chat/history:
    get:
      summary: Get conversation history
      description: Returns the full conversation history
      responses:
        '200':
          description: Conversation history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Clear conversation history
      description: Clears all conversation history
      responses:
        '200':
          description: History cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to access the API. Send the key in the X-API-Key header.
  schemas:
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: The role of the message sender
        content:
          type: string
          description: The message content
      example:
        role: user
        content: Hello!
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The user's message to send to the chatbot
      example:
        message: Hello, how are you?
    ChatResponse:
      type: object
      required:
        - response
        - conversationHistory
      properties:
        response:
          type: string
          description: The chatbot's response
        conversationHistory:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Last 10 messages of conversation history
      example:
        response: "Hello! How can I help you today?"
        conversationHistory:
          - role: user
            content: Hello!
          - role: assistant
            content: "Hello! How can I help you today?"
    AboutResponse:
      type: object
      required:
        - name
        - title
        - location
        - summary
        - highlights
      properties:
        name:
          type: string
          description: Full name
        title:
          type: string
          description: Job title
        location:
          type: string
          description: Location and work mode
        summary:
          type: string
          description: Professional summary
        highlights:
          type: array
          items:
            type: string
          description: Summary highlights
      example:
        name: David Sabalete Rodríguez
        title: Senior Full Stack Developer
        location: Barcelona, Spain · Remote
        summary: "Senior Full Stack Developer with 20+ years building performant, accessible web applications using Vue.js, Nuxt.js, and modern JavaScript."
        highlights:
          - "Reduced initial load times by up to 45% through code splitting, lazy loading, and optimized asset delivery"
          - "Built 20+ reusable component libraries adopted across multiple teams"
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          description: Application version
      example:
        status: ok
        timestamp: "2026-07-28T17:43:08.651Z"
        version: "1.0.0"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
      example:
        error: "Message is required"
    HistoryResponse:
      type: object
      required:
        - conversationHistory
      properties:
        conversationHistory:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Full conversation history
      example:
        conversationHistory:
          - role: user
            content: Hello!
          - role: assistant
            content: "Hello! How can I help you today?"
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Status message
      example:
        message: "History cleared"
    WorkExperienceItem:
      type: object
      required:
        - role
        - company
        - period
        - achievements
      properties:
        role:
          type: string
          description: Job title/role
        company:
          type: string
          description: Company name
        period:
          type: string
          description: Employment period
        achievements:
          type: array
          items:
            type: string
          description: Key achievements and responsibilities
      example:
        role: Senior Full Stack Developer
        company: LoveToKnow Media Spain
        period: "November 2019 – January 2026"
        achievements:
          - Led frontend architecture for YourDictionary.com (45M+ monthly visitors) using Vue.js and Nuxt.js + AWS serverless stack
          - Improved Lighthouse performance scores from 55 to 92+, reducing Largest Contentful Paint by 60%
    ExperienceResponse:
      type: object
      required:
        - experience
      properties:
        experience:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperienceItem'
          description: List of work experiences
      example:
        experience:
          - role: Senior Full Stack Developer
            company: LoveToKnow Media Spain
            period: "November 2019 – January 2026"
            achievements:
              - Led frontend architecture for YourDictionary.com (45M+ monthly visitors) using Vue.js and Nuxt.js + AWS serverless stack
              - Improved Lighthouse performance scores from 55 to 92+, reducing Largest Contentful Paint by 60%